# Custom cargo build (private crate patch + protoc), then the shared
# nix-rust-prebuilt publish workflow uploads the rolling `prebuilt` Release.
name: release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - ".nix/prebuilt-hashes.json"
      - "**/*.md"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.system }}
    if: ${{ !contains(github.event.head_commit.message || '', 'record prebuilt hashes') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-dist-${{ matrix.system }}
          cache-on-failure: true

      - name: Install protoc (macOS)
        run: brew install protobuf

      - name: Drop private async-openai git patch
        # Public CI cannot clone xAI's our-forks/async-openai. crates.io 0.33.0
        # is missing ReasoningEffort::Max (fork-only). Map Max → High in-tree
        # for this job only — do not commit that workaround.
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cargo = Path("Cargo.toml")
          text = cargo.read_text()
          needle = (
              "[patch.crates-io]\n"
              'async-openai = { git = "https://github.com/our-forks/async-openai.git", '
              'rev = "95b52ebdedf42143083cf3d6f0e0be7c84e9c808" }\n\n'
          )
          if needle not in text:
              raise SystemExit("expected [patch.crates-io] async-openai block missing")
          cargo.write_text(text.replace(needle, "", 1))
          print("removed [patch.crates-io] async-openai")

          types = Path("crates/codegen/xai-grok-sampling-types/src/types.rs")
          src = types.read_text()
          src2 = src.replace(
              "Self::Max => crate::rs::ReasoningEffort::Max,",
              "Self::Max => crate::rs::ReasoningEffort::High,",
          )
          src2 = src2.replace(
              "            crate::rs::ReasoningEffort::Max => Self::Max,\n",
              "",
          )
          if src2 == src:
              raise SystemExit("failed to patch ReasoningEffort::Max mappings")
          types.write_text(src2)
          print("mapped ReasoningEffort::Max -> High for crates.io async-openai")
          PY
          cargo update -p async-openai

      - name: Build
        run: |
          export PROTOC="$(command -v protoc)"
          echo "PROTOC=${PROTOC}"
          cargo build -p xai-grok-pager-bin --profile release-dist --features release-dist

      - name: Package
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          src=target/release-dist/xai-grok-pager
          test -x "$src"
          mkdir -p dist
          cp "$src" dist/grok
          if [ "${RUNNER_OS}" = "macOS" ]; then
            strip -x dist/grok || strip dist/grok
          else
            strip dist/grok
          fi
          chmod 755 dist/grok
          tar -czf "grok-${SYSTEM}.tar.gz" -C dist grok
          ls -lh "grok-${SYSTEM}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.system }}
          path: grok-${{ matrix.system }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  prebuilt:
    name: Publish prebuilt
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push'
              && !contains(github.event.head_commit.message, 'record prebuilt hashes')))
    needs: [build]
    permissions:
      contents: write
    uses: yangtau/nix-rust-prebuilt/.github/workflows/publish.yml@main
    with:
      name: grok
      skip-build: true
      hashes-path: .nix/prebuilt-hashes.json
      systems: '[{"os":"macos-14","system":"aarch64-darwin"}]'
    secrets: inherit
